# HiddenOre — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/HiddenOre/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /hiddenore language server edit vi_VI
#
# === Tiền tố ===
# prefix được thêm trước tin nhắn trò chuyện; chuỗi rỗng sẽ ẩn nó.
#
# === Định dạng ===
# Dùng &0-&f cho màu, &k-&o cho định dạng, &r để đặt lại và &#RRGGBB cho màu hex.
# Ví dụ: &aChữ xanh lá&r. Dùng \n trong chuỗi TOML có dấu ngoặc kép để xuống dòng.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị sau khi thay đổi
#   {amount}  Số lượng vật phẩm rơi
#   {argument}  đối số ngoài dự kiến
#   {before}  Giá trị trước khi thay đổi
#   {block}  Loại khối được đào
#   {chance}  Xác suất kích hoạt đã cấu hình
#   {command}  đường dẫn lệnh
#   {count}  Số lượng thông báo
#   {group}  Danh mục trong trình chỉnh sửa ngôn ngữ
#   {kept}  Chỉnh sửa cục bộ được giữ bởi bản cập nhật ngôn ngữ
#   {key}  Khóa thông báo hoặc tham số
#   {line}  Số dòng trong thông báo
#   {locale}  Mã ngôn ngữ
#   {material}  Loại vật phẩm rơi
#   {maximum}  Độ dài nhập tối đa trong trình chỉnh sửa
#   {number}  Số thứ tự mục
#   {page}  Số trang hiện tại
#   {pages}  Tổng số trang
#   {parameter}  tên tham số
#   {path}  Đường dẫn cài đặt
#   {personal}  Mã ngôn ngữ cá nhân
#   {plugin}  Tên plugin
#   {reason}  lý do lỗi
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {roll}  Giá trị ngẫu nhiên được lấy
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {target}  Plugin được chọn ngôn ngữ
#   {type}  kiểu
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {value}  giá trị hiện tại, mặc định hoặc thô
#   {variables}  chỗ giữ chỗ hợp lệ
#   {vein}  Tên mạch quặng

