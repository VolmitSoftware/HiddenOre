# HiddenOre — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/HiddenOre/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /hiddenore language server edit fi_FI
#
# === Etuliite ===
# prefix lisätään chat-viestien alkuun; tyhjä merkkijono piilottaa sen.
#
# === Muotoilu ===
# Käytä &0-&f värejä, &k-&o muotoilua, &r palautusta ja &#RRGGBB heksadesimaalivärejä varten.
# Esimerkiksi: &aVihreä teksti&r. Käytä lainausmerkeissä olevissa TOML-merkkijonoissa \n rivinvaihtoon.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  Arvo muutoksen jälkeen
#   {amount}  Pudotettavien esineiden määrä
#   {argument}  odottamaton argumentti
#   {before}  Arvo ennen muutosta
#   {block}  Louhitun kuution tyyppi
#   {chance}  Määritetty laukaisutodennäköisyys
#   {command}  komentopolku
#   {count}  Viestien määrä
#   {group}  Kielieditorin luokka
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  Viestin tai parametrin avain
#   {line}  Viestin rivinumero
#   {locale}  kielitunnus
#   {material}  Pudotettavan esineen tyyppi
#   {maximum}  Editorin syötteen enimmäispituus
#   {number}  Kohdan numero
#   {page}  Nykyinen sivu
#   {pages}  Sivujen kokonaismäärä
#   {parameter}  parametrin nimi
#   {path}  Asetuksen tai osion polku
#   {personal}  henkilökohtainen kielitunnus
#   {plugin}  Lisäosan nimi
#   {reason}  virheen syy
#   {remaining}  Jäljellä oleva aika seuraavaan kielitarkistukseen
#   {roll}  Arvottu satunnaisluku
#   {section}  Kielieditorin osio
#   {target}  Kielivalinnan kohdelisäosa
#   {type}  tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {value}  nykyinen, oletus- tai raaka-arvo
#   {variables}  sallitut paikkamerkit
#   {vein}  Malmisuonen nimi

