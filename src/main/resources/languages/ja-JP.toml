# HiddenOre — ja-JP
#
# === ファイルの編集 ===
# plugins/HiddenOre/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /hiddenore language server edit ja-JP
#
# === 接頭辞 ===
# prefix はチャットメッセージの前に付きます。空の文字列にすると非表示になります。
#
# === 書式 ===
# カラーコード: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {after}  変更後の値
#   {amount}  ドロップするアイテム数
#   {argument}  予期しない引数
#   {before}  変更前の値
#   {block}  採掘したブロックの種類
#   {chance}  設定された発動確率
#   {command}  コマンド経路
#   {count}  メッセージ数
#   {group}  言語エディターのカテゴリ
#   {key}  メッセージまたはパラメーターのキー
#   {line}  メッセージ内の行番号
#   {locale}  ロケール
#   {material}  ドロップするアイテムの種類
#   {maximum}  最大許容値
#   {number}  項目番号
#   {page}  現在のページ番号
#   {pages}  ページの総数
#   {parameter}  パラメーター名
#   {path}  設定項目のパス
#   {personal}  個人設定のロケール
#   {plugin}  プラグイン名
#   {reason}  失敗理由
#   {roll}  抽選された乱数値
#   {target}  言語選択の対象プラグイン
#   {type}  型
#   {usage}  使用法
#   {value}  現在値、既定値、または入力値
#   {variables}  使用可能なプレースホルダー
#   {vein}  鉱脈名

