# HiddenOre — ko_KR
#
# === 파일 편집 ===
# plugins/HiddenOre/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /hiddenore language server edit ko_KR
#
# === 접두사 ===
# prefix는 채팅 메시지 앞에 붙습니다. 빈 문자열로 설정하면 숨겨집니다.
#
# === 서식 ===
# 색상 코드: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {after}  변경 후 가치
#   {amount}  드롭되는 아이템 수
#   {argument}  예상하지 못한 인수
#   {before}  변경 전의 값
#   {block}  채굴한 블록 종류
#   {chance}  설정된 발동 확률
#   {command}  명령 경로
#   {count}  메시지 수
#   {group}  언어 편집기 분류
#   {key}  메시지 또는 매개변수 키
#   {line}  메시지 안의 줄 번호
#   {locale}  로케일
#   {material}  드롭되는 아이템 종류
#   {maximum}  최대 허용 값
#   {number}  항목 번호
#   {page}  현재 페이지 번호
#   {pages}  전체 페이지 수
#   {parameter}  매개변수 이름
#   {path}  설정 항목 경로
#   {personal}  개인 로케일
#   {plugin}  Plugin 이름
#   {reason}  실패 이유
#   {roll}  추출된 난수 값
#   {section}  언어 편집기 섹션
#   {target}  언어 선택 대상 플러그인
#   {type}  형식
#   {value}  현재값, 기본값 또는 원시값
#   {variables}  사용 가능한 자리표시자
#   {vein}  광맥 이름

