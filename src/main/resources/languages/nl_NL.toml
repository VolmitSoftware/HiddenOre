# HiddenOre — nl_NL
#
# === Bestand bewerken ===
# plugins/HiddenOre/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /hiddenore language server edit nl_NL
#
# === Voorvoegsel ===
# prefix staat vóór chatberichten; een lege tekenreeks verbergt het.
#
# === Opmaak ===
# Kleurcodes: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {after}  Waarde na de wijziging
#   {amount}  Aantal gedropte voorwerpen
#   {argument}  onverwacht argument
#   {before}  Waarde vóór de wijziging
#   {block}  Type van het gedolven blok
#   {chance}  Ingestelde activeringskans
#   {command}  opdrachtpad
#   {count}  Aantal berichten
#   {group}  Categorie in de taaleditor
#   {key}  Bericht- of parametersleutel
#   {line}  Regelnummer binnen een bericht
#   {locale}  landinstelling
#   {material}  Type van het gedropte voorwerp
#   {maximum}  Maximaal toegestane waarde
#   {number}  Nummer van de vermelding
#   {page}  Huidige pagina
#   {pages}  Totaal aantal pagina’s
#   {path}  Pad naar de instelling of sectie
#   {parameter}  parameternaam
#   {personal}  persoonlijke landinstelling
#   {plugin}  Pluginnaam
#   {reason}  foutreden
#   {roll}  Getrokken willekeurige waarde
#   {section}  Sectie van de taaleditor
#   {target}  Plugin waarvoor de taal wordt gekozen
#   {type}  type
#   {value}  huidige, standaard- of ruwe waarde
#   {variables}  geldige tijdelijke aanduidingen
#   {vein}  Naam van de ertsader

