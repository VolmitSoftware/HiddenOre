# HiddenOre — ru_RU
#
# === Редактирование файла ===
# plugins/HiddenOre/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /hiddenore language server edit ru_RU
#
# === Префикс ===
# prefix добавляется перед сообщениями чата; пустая строка скрывает его.
#
# === Форматирование ===
# Цветовые коды: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {after}  Ценность после изменения
#   {amount}  Количество выпадающих предметов
#   {argument}  неожиданный аргумент
#   {before}  Ценность перед изменением
#   {block}  Тип добытого блока
#   {chance}  Настроенная вероятность срабатывания
#   {command}  путь команды
#   {count}  Количество сообщений
#   {group}  Категория редактора языка
#   {key}  Ключ сообщения или параметра
#   {line}  Номер строки в сообщении
#   {locale}  локаль
#   {material}  Тип выпадающего предмета
#   {maximum}  Максимально допустимая стоимость
#   {number}  Номер записи
#   {page}  Номер текущей страницы
#   {pages}  Общее число страниц
#   {parameter}  имя параметра
#   {path}  Путь к настройке
#   {personal}  личная локаль
#   {plugin}  Название плагина
#   {reason}  причина ошибки
#   {roll}  Полученное случайное число
#   {target}  Плагин, для которого выбирается язык
#   {type}  тип
#   {usage}  использование команды
#   {value}  текущее, стандартное или исходное значение
#   {variables}  допустимые заполнители
#   {vein}  Название рудной жилы

