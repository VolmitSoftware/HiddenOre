# HiddenOre — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/HiddenOre/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /hiddenore language server edit tr_TR
#
# === Önek ===
# prefix sohbet mesajlarının önüne eklenir; boş metin onu gizler.
#
# === Biçimlendirme ===
# Renk kodları: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {after}  Değişim sonrası Değer
#   {amount}  Düşen eşya sayısı
#   {argument}  beklenmeyen argüman
#   {before}  Değişim öncesinde değer
#   {block}  Kazılan blok türü
#   {chance}  Ayarlanan tetiklenme olasılığı
#   {command}  komut yolu
#   {count}  Mesaj sayısı
#   {group}  Dil düzenleyicisi kategorisi
#   {key}  İleti veya parametre anahtarı
#   {line}  Mesaj içindeki satır numarası
#   {locale}  yerel ayar
#   {material}  Düşen eşya türü
#   {maximum}  Maksimum izin verilen değer
#   {number}  Kayıt numarası
#   {page}  Geçerli sayfa numarası
#   {pages}  Toplam sayfa sayısı
#   {parameter}  parametre adı
#   {path}  Ayarın yolu
#   {personal}  kişisel yerel ayar
#   {plugin}  Plugin name
#   {reason}  hata nedeni
#   {roll}  Çekilen rastgele değer
#   {target}  Dil seçiminin uygulandığı eklenti
#   {type}  tür
#   {usage}  komut kullanımı
#   {value}  geçerli, varsayılan veya ham değer
#   {variables}  geçerli yer tutucular
#   {vein}  Cevher damarı adı

