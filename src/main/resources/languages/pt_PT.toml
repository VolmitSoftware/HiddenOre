# HiddenOre — pt_PT
#
# === Editar o ficheiro ===
# plugins/HiddenOre/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /hiddenore language server edit pt_PT
#
# === Prefixo ===
# prefix é acrescentado antes das mensagens do chat; uma cadeia vazia oculta-o.
#
# === Formatação ===
# Códigos de cor: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {after}  Valor após a alteração
#   {amount}  Quantidade de itens largados
#   {argument}  argumento inesperado
#   {before}  Valor antes da alteração
#   {block}  Tipo de bloco minerado
#   {chance}  Probabilidade de ativação configurada
#   {command}  caminho do comando
#   {count}  Número de mensagens
#   {group}  Categoria do editor de idiomas
#   {key}  Chave da mensagem ou do parâmetro
#   {line}  Número da linha da mensagem
#   {locale}  região
#   {material}  Tipo de item largado
#   {maximum}  Valor máximo autorizado
#   {number}  Número da entrada
#   {page}  Página atual
#   {pages}  Número total de páginas
#   {path}  Caminho da definição ou da secção
#   {parameter}  nome do parâmetro
#   {personal}  região pessoal
#   {plugin}  Nome do plug-in
#   {reason}  motivo da falha
#   {roll}  Valor aleatório sorteado
#   {section}  Secção do editor de idiomas
#   {target}  Plugin a que se aplica a escolha de idioma
#   {type}  tipo
#   {value}  valor atual, predefinido ou bruto
#   {variables}  marcadores válidos
#   {vein}  Nome do filão

