# HiddenOre — zh_CN
#
# === 编辑文件 ===
# plugins/HiddenOre/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /hiddenore language server edit zh_CN
#
# === 前缀 ===
# prefix 添加在聊天消息前；设为空字符串即可隐藏。
#
# === 格式 ===
# 颜色代码: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {after}  更改后的数值
#   {amount}  掉落物品数量
#   {argument}  意外参数
#   {before}  变化前的价值
#   {block}  开采的方块类型
#   {chance}  配置的触发概率
#   {command}  命令路径
#   {count}  消息数量
#   {group}  语言编辑器分类
#   {key}  消息或参数的键
#   {line}  消息中的行号
#   {locale}  区域设置
#   {material}  掉落物品类型
#   {maximum}  允许的最大值
#   {number}  条目编号
#   {page}  当前页码
#   {pages}  总页数
#   {parameter}  参数名称
#   {path}  设置项路径
#   {personal}  个人区域设置
#   {plugin}  插件名称
#   {reason}  失败原因
#   {roll}  抽取的随机数值
#   {section}  语言编辑器分区
#   {target}  应用语言选择的插件
#   {type}  类型
#   {value}  当前值、默认值或原始值
#   {variables}  可用占位符
#   {vein}  矿脉名称

