# HiddenOre — fr_FR
#
# === Modifier le fichier ===
# plugins/HiddenOre/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /hiddenore language server edit fr_FR
#
# === Préfixe ===
# prefix précède les messages du chat ; une chaîne vide le masque.
#
# === Mise en forme ===
# Codes de couleur: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {after}  Valeur après le changement
#   {amount}  Nombre d’objets lâchés
#   {argument}  argument inattendu
#   {before}  Valeur avant la variation
#   {block}  Type du bloc miné
#   {chance}  Probabilité de déclenchement configurée
#   {command}  chemin de commande
#   {count}  Nombre de messages
#   {group}  Catégorie de l’éditeur de langue
#   {key}  Clé de message ou de paramètre
#   {line}  Numéro de ligne dans un message
#   {locale}  code régional
#   {material}  Type de l’objet lâché
#   {maximum}  Valeur maximale autorisée
#   {number}  Numéro de l’entrée
#   {page}  Page actuelle
#   {pages}  Nombre total de pages
#   {path}  Chemin du paramètre ou de la section
#   {parameter}  nom du paramètre
#   {personal}  code régional personnel
#   {plugin}  Nom du greffon
#   {reason}  motif de l’échec
#   {roll}  Valeur aléatoire tirée
#   {target}  Plugin visé par le choix de langue
#   {type}  type
#   {usage}  syntaxe de commande
#   {value}  valeur actuelle, par défaut ou brute
#   {variables}  variables valides
#   {vein}  Nom du filon

