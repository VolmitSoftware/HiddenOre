# HiddenOre — de_DE
#
# === Datei bearbeiten ===
# plugins/HiddenOre/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /hiddenore language server edit de_DE
#
# === Präfix ===
# prefix steht vor Chatnachrichten; eine leere Zeichenfolge blendet ihn aus.
#
# === Formatierung ===
# Farbcodes: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {after}  Wert nach der Änderung
#   {amount}  Anzahl der fallen gelassenen Gegenstände
#   {argument}  unerwartetes Argument
#   {before}  Wert vor der Änderung
#   {block}  Typ des abgebauten Blocks
#   {chance}  Eingestellte Auslösewahrscheinlichkeit
#   {command}  Befehlspfad
#   {count}  Anzahl der Nachrichten
#   {group}  Kategorie des Spracheneditors
#   {key}  Nachrichten- oder Parameterschlüssel
#   {line}  Zeilennummer innerhalb einer Nachricht
#   {locale}  Sprachkennung
#   {material}  Typ des fallengelassenen Gegenstands
#   {maximum}  Zulässiger Höchstwert
#   {number}  Nummer des Eintrags
#   {page}  Aktuelle Seite
#   {pages}  Gesamtzahl der Seiten
#   {parameter}  Parametername
#   {path}  Pfad der Konfigurationseinstellung
#   {personal}  persönliche Sprachkennung
#   {plugin}  Plugin Name
#   {reason}  Fehlergrund
#   {roll}  Gezogener Zufallswert
#   {section}  Bereich des Spracheneditors
#   {target}  Plugin für die Sprachauswahl
#   {type}  Parametertyp
#   {value}  aktueller, Standard- oder Rohwert
#   {variables}  gültige Platzhalter
#   {vein}  Name der Erzader

