# HiddenOre — pl_PL
#
# === Edycja pliku ===
# plugins/HiddenOre/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /hiddenore language server edit pl_PL
#
# === Prefiks ===
# prefix jest dodawany przed wiadomościami czatu; pusty ciąg go ukrywa.
#
# === Formatowanie ===
# Kody kolorów: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {after}  Wartość po zmianie
#   {amount}  Liczba upuszczanych przedmiotów
#   {argument}  nieoczekiwany argument
#   {before}  Wartość przed zmianą
#   {block}  Typ wykopanego bloku
#   {chance}  Ustawione prawdopodobieństwo aktywacji
#   {command}  ścieżka polecenia
#   {count}  Liczba wiadomości
#   {group}  Kategoria edytora języka
#   {key}  Klucz wiadomości lub parametru
#   {line}  Numer wiersza wiadomości
#   {locale}  ustawienia regionalne
#   {material}  Typ upuszczanego przedmiotu
#   {maximum}  Maksymalna dopuszczalna wartość
#   {number}  Numer wpisu
#   {page}  Bieżąca strona
#   {pages}  Łączna liczba stron
#   {path}  Ścieżka ustawienia lub sekcji
#   {parameter}  nazwa parametru
#   {personal}  osobiste ustawienie regionalne
#   {plugin}  Nazwa wtyczki
#   {reason}  powód błędu
#   {roll}  Wylosowana wartość
#   {section}  Sekcja edytora języków
#   {target}  Wtyczka, dla której wybierany jest język
#   {type}  typ
#   {value}  wartość bieżąca, domyślna lub surowa
#   {variables}  dozwolone symbole zastępcze
#   {vein}  Nazwa żyły rudy

