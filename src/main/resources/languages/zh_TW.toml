# HiddenOre — zh_TW
#
# === 編輯檔案 ===
# plugins/HiddenOre/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /hiddenore language server edit zh_TW
#
# === 前綴 ===
# prefix 加在聊天訊息前；設為空字串即可隱藏。
#
# === 格式 ===
# 色彩代碼: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {after}  變更后的值
#   {amount}  掉落物品數量
#   {argument}  意外引數
#   {before}  變更前的值
#   {block}  開採的方塊類型
#   {chance}  設定的觸發機率
#   {command}  指令路徑
#   {count}  訊息數量
#   {group}  語言編輯器類別
#   {key}  訊息或參數的鍵
#   {line}  訊息中的行號
#   {locale}  地區設定
#   {material}  掉落物品類型
#   {maximum}  最大允許值
#   {number}  項目編號
#   {page}  目前頁碼
#   {pages}  總頁數
#   {parameter}  參數名稱
#   {path}  設定項目路徑
#   {personal}  個人地區設定
#   {plugin}  插件名稱
#   {reason}  失敗原因
#   {roll}  抽取的隨機數值
#   {section}  語言編輯器區段
#   {target}  套用語言選擇的外掛
#   {type}  類型
#   {value}  目前值、預設值或原始值
#   {variables}  可用佔位符
#   {vein}  礦脈名稱

