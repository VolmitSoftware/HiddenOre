# HiddenOre — he_IL
#
# === עריכת הקובץ ===
# plugins/HiddenOre/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /hiddenore language server edit he_IL
#
# === קידומת ===
# prefix נוסף לפני הודעות הצ׳אט; מחרוזת ריקה מסתירה אותו.
#
# === עיצוב ===
# קודי צבע: &0-&f, &k-&o, &r, &#RRGGBB; &a...&r.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {after}  ערך לאחר השינוי
#   {amount}  מספר הפריטים שנופלים
#   {argument}  ארגומנט לא צפוי
#   {before}  ערך לפני השינוי
#   {block}  סוג הבלוק שנכרה
#   {chance}  הסתברות ההפעלה שהוגדרה
#   {command}  נתיב פקודה
#   {count}  מספר ההודעות
#   {group}  קטגוריה בעורך השפה
#   {key}  מפתח הודעה או פרמטר
#   {line}  מספר השורה בהודעה
#   {locale}  אזור שפה
#   {material}  סוג הפריט שנופל
#   {maximum}  ערך מותר מקסימלי
#   {number}  מספר הרשומה
#   {page}  מספר העמוד הנוכחי
#   {pages}  מספר העמודים הכולל
#   {parameter}  שם פרמטר
#   {path}  נתיב ההגדרה
#   {personal}  אזור השפה האישי
#   {plugin}  שם Plugin
#   {reason}  סיבת כשל
#   {roll}  הערך האקראי שהוגרל
#   {section}  מקטע בעורך השפות
#   {target}  התוסף שעבורו נבחרת השפה
#   {type}  סוג
#   {value}  ערך נוכחי, ברירת מחדל או גולמי
#   {variables}  מצייני מקום תקינים
#   {vein}  שם עורק העפרה

