# Command rewards roll separately on eligible breaks in either generation mode.
[[drops]]
# Use "command" for command rewards; item rules can omit type.
type = "command"
# Run every listed command on a successful roll; player:/console: override execute_as.
# Variables: %player%, %uuid%, %world%, and the mined block's %x%, %y%, %z%.
commands = [
  "player:say I rolled a player-level bonus!",
  "console:say %player% rolled a server-level bonus!",
  "give %player% diamond 1"
]
# Chance per eligible break: 0 never, 1 always.
# Example: 0.0005 = 0.05%, about 1 in 2,000 breaks.
chance = 0.0005
# Lowest eligible Y level, inclusive.
min_y = -64
# Highest eligible Y level, inclusive.
max_y = 320
# Sender for unprefixed commands: "console" or "player" (uses the miner's permissions).
execute_as = "console"
