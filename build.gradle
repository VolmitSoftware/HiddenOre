import art.arcane.volmit.packaging.PackagingMode
import art.arcane.volmit.packaging.PackedJar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath('com.github.VolmitSoftware.VolmLib:packaging:master-SNAPSHOT')
    }
}

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
    alias(libs.plugins.slimjar)
}

apply plugin: 'art.arcane.volmit-packaging'

group = 'art.arcane'
String hiddenoreVersion = providers.gradleProperty('hiddenoreVersion').get()
version = hiddenoreVersion
ext.bukkitMinecraftRange = providers.gradleProperty('bukkitMinecraftRange').getOrElse('26.1.2-26.3')
def apiVersion = '26.1'
def main = 'art.arcane.hiddenore.HiddenOre'
def lib = 'art.arcane.hiddenore.libs'
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()
String authTokenProperty = providers.gradleProperty('authToken').orNull
String jitpackAuthToken = authTokenProperty ?: providers.gradleProperty('jitpackAuthToken').orNull
String languageSourceRepository = providers.gradleProperty('languageSourceRepository').orElse('VolmitSoftware/HiddenOre').get()
String languageSourceBranch = providers.gradleProperty('languageSourceBranch').orElse(providers.provider {
    try {
        Process process = new ProcessBuilder('git', 'symbolic-ref', '--short', 'refs/remotes/origin/HEAD')
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.text.trim()
        if (process.waitFor() == 0 && output.startsWith('origin/')) {
            return output.substring('origin/'.length())
        }
    } catch (IOException | InterruptedException ignored) {
    }
    return 'master'
}).get()
if (!(languageSourceRepository ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) {
    throw new GradleException('languageSourceRepository must be a GitHub owner/repository')
}
if (!(languageSourceBranch ==~ /[A-Za-z0-9][A-Za-z0-9._\/-]{0,127}/) || languageSourceBranch.contains('..')) {
    throw new GradleException('languageSourceBranch must be a Git branch name')
}
String languageSourcePath = 'src/main/resources/languages'
String languageSourceResource = 'hiddenore-language-source.properties'
List<File> languageSourceFiles = fileTree(languageSourcePath) {
    include('*.toml')
}.files.toList().sort { File left, File right -> left.name <=> right.name }
List<String> languageSourceLocales = new ArrayList<>(languageSourceFiles.size())
for (File languageSourceFile : languageSourceFiles) {
    String locale = languageSourceFile.name.substring(0, languageSourceFile.name.length() - '.toml'.length())
    languageSourceLocales.add(locale)
}
def languageSourceManifestTask = tasks.register('generateLanguageSourceManifest', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file("generated/language-source/${languageSourceResource}"))
    property('repository', languageSourceRepository)
    property('branch', languageSourceBranch)
    property('path', languageSourcePath)
    property('extension', '.toml')
    property('locales', languageSourceLocales.join(','))
}

def shadowJarTask = tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
tasks.named('slimJar').get()

tasks.named('jar', org.gradle.api.tasks.bundling.Jar).configure {
    archiveClassifier.set('thin')
}

tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
    exclude('languages/**')
}

tasks.named('build').configure {
    dependsOn(shadowJarTask)
}

shadowJarTask.configure {
    archiveClassifier.set('')
    archiveFileName.set("HiddenOre v${project.version} [CraftBukkit] ${bukkitMinecraftRange}.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    minimize()
    relocate('io.github.slimjar', "${lib}.slimjar")
    relocate('org.bstats', "${lib}.bstats")
    relocate('net.kyori', "${lib}.kyori") {
        skipStringConstants = true
    }
}

tasks.named('processResources').configure {
    dependsOn(languageSourceManifestTask)
    exclude('languages/*.toml')
    from(languageSourceManifestTask)
    def pluginProperties = [
        name      : rootProject.name,
        version   : project.version,
        main      : main,
        apiVersion: apiVersion,
    ]

    inputs.properties(pluginProperties)
    filesMatching('**/plugin.yml') {
        expand(pluginProperties)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'none'
    options.release.set(25)
}

slimJar {
    relocate('org.bstats', "${lib}.bstats")
    relocate('net.kyori', "${lib}.kyori")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://repo.extendedclip.com/releases/')
    }
    maven {
        url = uri('https://jitpack.io')
        if (jitpackAuthToken != null) {
            credentials {
                username = jitpackAuthToken
                password = '.'
            }
        }
    }
}

dependencies {
    implementation('de.crazydev22.slimjar.helper:spigot:2.1.9')
    compileOnly(libs.paper)
    compileOnly('me.clip:placeholderapi:2.11.6') {
        transitive = false
    }
    implementation(volmLibCoordinate) {
        changing = true
        transitive = false
    }
    slim(libs.bstats)
    slim('com.moandjiezana.toml:toml4j:0.7.2') {
        exclude(group: 'com.google.code.gson')
    }
    slim('net.kyori:adventure-api:4.26.1')
    slim('net.kyori:adventure-text-minimessage:4.26.1')
    slim('net.kyori:adventure-text-serializer-legacy:4.26.1')
    slim('net.kyori:adventure-text-serializer-plain:4.26.1')
    testImplementation('junit:junit:4.13.2')
    testImplementation(libs.paper)
    testImplementation('me.clip:placeholderapi:2.11.6') {
        transitive = false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
    resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    System.err.println()
    System.err.println('=========================================================================================================')
    System.err.println('You must run gradle on Java 25 or newer. You are using ' + JavaVersion.current())
    System.err.println()
    System.err.println('=== For IDEs ===')
    System.err.println('1. Configure the project for Java 25')
    System.err.println('2. Configure the bundled gradle to use Java 25 in settings')
    System.err.println()
    System.err.println('=== For Command Line (gradlew) ===')
    System.err.println('1. Install JDK 25 from https://adoptium.net/temurin/releases/?version=25')
    System.err.println('2. Set JAVA_HOME environment variable to the new jdk installation folder')
    System.err.println('3. Open a new command prompt window to get the new environment variables if need be.')
    System.err.println('=========================================================================================================')
    System.err.println()
    System.exit(69)
}

pluginPackaging {
    artifacts {
        create('distribution') {
            stripDirectories = true
            stripLocalVariables = true
            releaseCompression = providers.gradleProperty('compactRelease').map { it.toBoolean() }
                    .getOrElse(!PackagingMode.resolve(providers).development())
            packed = true
            taskName = 'shadowJar'
            policyName = 'HiddenOre'
            prunePrefixes = ['art/arcane/volmlib/']
            keepPrefixes = ['art/arcane/volmlib/util/matter/slices/']
            shrinkRules = [file('packaging/shrink.pro')]
            shrinkRelocations = [
                'org.bstats': "${lib}.bstats",
                'net.kyori': "${lib}.kyori"
            ]
        }
    }
}

configurations {
    paper263Compatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_API))
            attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    paper263Compatibility('io.papermc.paper:paper-api:26.3.build.25-alpha')
}

tasks.register('compilePaper263Compatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.paper263Compatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-') && !dependency.name.startsWith('spigot-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/paper263Compatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('check').configure {
    dependsOn(tasks.named('compilePaper263Compatibility'))
}

tasks.register('verifyLanguagePackaging') {
    dependsOn(shadowJarTask)
    inputs.file(shadowJarTask.flatMap { it.archiveFile })
    doLast {
        File artifact = shadowJarTask.get().archiveFile.get().asFile
        java.util.zip.ZipFile archive = new java.util.zip.ZipFile(artifact)
        Set<String> bundledLanguages = new TreeSet<>()
        Properties languageManifest = null
        try {
            Enumeration<? extends java.util.zip.ZipEntry> entries = archive.entries()
            while (entries.hasMoreElements()) {
                java.util.zip.ZipEntry entry = entries.nextElement()
                String path = entry.name
                if (!entry.directory && path.startsWith('languages/') && path.endsWith('.toml')) {
                    bundledLanguages.add(path.substring('languages/'.length(), path.length() - '.toml'.length()))
                }
                if (!entry.directory && path == languageSourceResource) {
                    languageManifest = new Properties()
                    archive.getInputStream(entry).withCloseable { InputStream input -> languageManifest.load(input) }
                }
            }
        } finally {
            archive.close()
        }
        if (!bundledLanguages.isEmpty()) {
            throw new GradleException("Runtime artifact contains language resources: ${bundledLanguages}")
        }
        if (languageManifest == null) {
            throw new GradleException("Runtime artifact is missing ${languageSourceResource}")
        }
        if (languageManifest.getProperty('repository') != languageSourceRepository
                || languageManifest.getProperty('branch') != languageSourceBranch
                || languageManifest.getProperty('path') != languageSourcePath
                || languageManifest.getProperty('extension') != '.toml'
                || languageManifest.getProperty('locales') != languageSourceLocales.join(',')) {
            throw new GradleException('Runtime language source manifest does not match the build source set')
        }
        if (languageManifest.stringPropertyNames().any { String key ->
            key == 'revision' || key == 'mode' || key.startsWith('sha256.')
        }) {
            throw new GradleException('Runtime language source manifest must track the repository branch, not a pinned revision')
        }
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('verifyLanguagePackaging'))
}

sourceSets {
    gameplayFixture {
        java.srcDir('src/test/gameplay/fixture/java')
        resources.srcDir('src/test/gameplay/fixture/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.register('gameplayFixtureJar', Jar) {
    dependsOn('gameplayFixtureClasses')
    archiveBaseName.set('HiddenOreGameplayFixture')
    archiveVersion.set('')
    from(sourceSets.gameplayFixture.output)
}

tasks.named('check').configure {
    dependsOn('gameplayFixtureJar')
}

tasks.register('gameplayContractTest', Exec) {
    commandLine('node', '--test', 'src/test/gameplay/persistence.test.mjs')
}

tasks.named('check').configure {
    dependsOn('gameplayContractTest')
}

tasks.register('prepareRelease', Sync) {
    group = 'distribution'
    description = 'Verifies and stages the CraftBukkit release jar.'
    dependsOn('check', 'packedJar')
    from(tasks.named('packedJar', PackedJar).flatMap { PackedJar archive -> archive.outputJar })
    into(layout.buildDirectory.dir('release'))
    rename { String name -> "HiddenOre-${project.version}-bukkit.jar" }
}

tasks.register('buildSwiftSwamp', Copy) {
    group = 'development'
    description = 'Builds, verifies, and stages HiddenOre in the workspace BUILDS directory.'
    dependsOn('check', 'packedJar')
    outputs.upToDateWhen { false }
    from(tasks.named('packedJar', PackedJar).flatMap { PackedJar archive -> archive.outputJar })
    into(providers.gradleProperty('buildsDirectory').orElse('../BUILDS'))
    rename { String ignored -> 'HiddenOre.jar' }
}

apply from: 'gradle/multiplexor.gradle'
